name: Release

# Builds the Windows exe when a version tag is pushed and publishes a GitHub Release.
# Tag format: v<major>.<minor>.<patch> (a suffix such as -rc1 publishes a pre-release).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    permissions:
      contents: write          # create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag must match the package version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME.TrimStart("v") -replace "-.*$", ""
          $init = [regex]::Match((Get-Content plumbcenter/__init__.py -Raw), '__version__\s*=\s*"([^"]+)"').Groups[1].Value
          if ($init -ne $tag) { throw "Tag $($env:REF_NAME) does not match plumbcenter/__init__.py version $init" }
          Write-Output "Releasing $init"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Build exe, smoke-test, zip
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $zip = Get-ChildItem dist/PlumbCenter-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw "No zip produced" }
          $ghArgs = @("release", "create", $env:REF_NAME, $zip.FullName, "$($zip.FullName).sha256",
                      "--title", "PlumbCenter $($env:REF_NAME)", "--generate-notes", "--verify-tag")
          if ($env:REF_NAME -match "-") { $ghArgs += "--prerelease" }
          gh @ghArgs
